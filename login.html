<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | NovaCart</title>
    <meta name="description" content="Sign in to your NovaCart account to manage orders and profile details." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #5b5cf6;
        --primary-dark: #3f41cd;
        --text: #162033;
        --muted: #64748b;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #f8f9ff, #eef2ff);
        min-height: 100vh;
      }

      .navbar {
        backdrop-filter: blur(14px);
        background: rgba(255, 255, 255, 0.9) !important;
        border-bottom: 1px solid rgba(91, 92, 246, 0.08);
      }

      .navbar-brand {
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--primary) !important;
      }

      .auth-card {
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 1.5rem;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
      }

      .footer {
        background: #0f172a;
        color: #cbd5e1;
      }

      .text-error {
        color: #dc3545;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand fs-3" href="index.html">NovaCart</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5">
            <div class="auth-card p-4 p-lg-5 bg-white">
              <div class="text-center mb-4">
                <h1 class="fw-bold">Welcome back</h1>
                <p class="text-muted mb-0">Sign in to continue your stylish journey.</p>
              </div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="email" required />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" required />
                </div>
                <div id="errorMessage" class="text-error mb-3"></div>
                <button type="submit" class="btn btn-primary w-100">Log In</button>
              </form>

              <div class="text-center mt-4">
                <p class="mb-0 text-muted">Don’t have an account? <a href="register.html">Create one</a></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">© 2026 NovaCart. All rights reserved.</p>
      </div>
    </footer>

    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const errorMessage = document.getElementById("errorMessage");

      function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        errorMessage.textContent = "";

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!validateEmail(email)) {
          errorMessage.textContent = "Please enter a valid email address.";
          return;
        }

        if (password.length < 6) {
          errorMessage.textContent = "Password must be at least 6 characters.";
          return;
        }

        const users = JSON.parse(localStorage.getItem("novaUsers") || "[]");
        const match = users.find((user) => user.email === email && user.password === password);

        if (!match) {
          errorMessage.textContent = "No matching account found. Please register first.";
          return;
        }

        localStorage.setItem("novaSession", JSON.stringify({ email, name: match.name }));
        window.location.href = "profile.html";
      });
    </script>
  </body>
</html>
